<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">AI Water Break-Even</title>
  <desc id="desc">A net-balance curve crosses a zero line, moving from water use ahead in rust to savings ahead in teal.</desc>
  <rect width="64" height="64" fill="#F3F0E8"/>
  <rect x="2.5" y="2.5" width="59" height="59" fill="none" stroke="#203A36" stroke-width="2"/>

  <!-- Zero axis and time axis -->
  <path d="M10 10V55" fill="none" stroke="#203A36" stroke-width="2" stroke-linecap="square"/>
  <path d="M10 32H56" fill="none" stroke="#203A36" stroke-width="1.6" stroke-linecap="square"/>

  <!-- Net balance: negative (use-led) to positive (savings-led) -->
  <path d="M13 47C19 47 23.5 43.5 28.5 37.5C30 35.7 31.1 33.7 32 32" fill="none" stroke="#B45F46" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M32 32C37.8 27 41 21.8 47 19C50 17.6 53 17 56 17" fill="none" stroke="#167C75" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The zero-crossing point -->
  <circle cx="32" cy="32" r="3.1" fill="#F3F0E8" stroke="#203A36" stroke-width="1.7"/>
</svg>
